name: TestParty Reporter
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: TestParty Reporter
        uses: ./
        with:
          testparty_token: ${{ secrets.TESTPARTY_TOKEN }}
          repository_name: ${{ github.repository }}
          repository_id: ${{ github.repository_id }}
          urls: |
            - url: https://example-domains.com/test
              steps: []
            - url: https://example-domains.com/cart
              steps: []
            - url: https://example-domains.com/store
              steps: []
            - url: https://example-domains.com/product-list
              steps: []
            - url: https://example-domains.com/about
              steps:
                - scanAfterAction: false
                  type: button
                  selector: "test"
                  text: ""
            - url: https://example-domains.com
              steps: []
          setups: |
            []
          teardowns: |
            []